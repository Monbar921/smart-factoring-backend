# Настройки, общие для всех стендов. Значения ${...} Spring берёт из переменных окружения контейнера
# (environment в docker-compose.yml в smart-factoring-deploy), после ':' - значение по умолчанию.
# В тестах этот файл перекрывается app/src/test/resources/application.yml
server:
  # на стенде - BACKEND_PORT из smart-factoring-deploy, compose передаёт его как SERVER_PORT
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-factoring-backend
  servlet:
    multipart:
      # ZIP выгрузки генератора и events.csv (полный файл ЕФРСБ - десятки МБ)
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    hikari:
      # statement_timeout (мс) - сервер сам отменяет запрос дольше 30 с
      connection-init-sql: "set search_path to ${POSTGRES_SCHEMA:smart_factoring_test}; set statement_timeout to 30000;"
      connection-test-query: select 1
      connection-timeout: 30000
      driver-class-name: org.postgresql.Driver
      idle-timeout: 30000
      max-lifetime: 40000
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: ${POSTGRES_POOL:smart_factoring_backend}
      password: ${POSTGRES_PASSWORD}
      jdbc-url: ${POSTGRES_JDBC}
      username: ${POSTGRES_USER}
  liquibase:
    change-log: classpath:liquibase/db.changelog-master.xml
    default-schema: ${POSTGRES_SCHEMA:smart_factoring_test}
    parameters:
      appUsername: ${spring.datasource.hikari.username}
      schema: ${POSTGRES_SCHEMA:smart_factoring_test}

smart-factoring:
  demo:
    # каталог на сервере, из которого POST /demo/import берёт выгрузку генератора по относительному пути
    import-dir: ${DEMO_IMPORT_DIR:/data/demo}
  ml:
    # http - сервис моделей smart-factoring-ml, stub - встроенная заглушка (Р-35)
    mode: ${ML_MODE:stub}
    base-url: ${ML_BASE_URL:http://smart-factoring-ml:8000}
    timeout: 60s
    batch-size: 200
    # для stub: каталог с stub_buyer_scores.csv и stub_upd_scores.csv (необязательно)
    stub-scores-dir: ${ML_STUB_SCORES_DIR:}
  llm:
    # stub - шаблонные тексты без LLM, gigachat - GigaChat, off - без черновика (Р-12)
    mode: ${LLM_MODE:stub}
    # одновременных запросов к LLM: сотни карточек последовательно не уложатся в 10 минут (НФР-1.1)
    parallelism: ${LLM_PARALLELISM:8}
    gigachat:
      auth-key: ${GIGACHAT_AUTH_KEY:}
      scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
      auth-url: ${GIGACHAT_AUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
      api-url: ${GIGACHAT_API_URL:https://gigachat.devices.sberbank.ru/api/v1}
      model: ${GIGACHAT_MODEL:GigaChat}
      timeout: ${GIGACHAT_TIMEOUT:60s}
      # PEM корневого сертификата НУЦ Минцифры (Russian Trusted Root CA): без него TLS к GigaChat не пройдёт
      ca-cert: ${GIGACHAT_CA_CERT:}
