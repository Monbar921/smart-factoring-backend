server:
  port: 8099
spring:
  cloud:
    openfeign:
      autoconfiguration:
        jackson:
          enabled: true
  datasource:
    hikari:
      connection-test-query: select 1
      connection-init-sql: SET search_path TO smart_factoring_test
      connection-timeout: 30000
      driver-class-name: org.postgresql.Driver
      idle-timeout: 30000
      max-lifetime: 40000
      maximum-pool-size: 15
      minimum-idle: 15
      pool-name: postgres
      password: password
      jdbc-url: jdbc:postgresql://localhost:5432/postgres
      username: username
  liquibase:
    change-log: classpath:liquibase/db.changelog-master.xml
    parameters:
      appUsername: ${spring.datasource.hikari.username}
      schema: smart_factoring_test
      sql_schema: smart_factoring_test
    enabled: true
    default-schema: smart_factoring_test

smart-factoring:
  manual-upload:
    # тесты запускаются из каталога модуля app
    import-dir: src/test/resources/manual-upload
  ml:
    mode: stub
    stub-scores-dir: src/test/resources/manual-upload/fixture-v1
